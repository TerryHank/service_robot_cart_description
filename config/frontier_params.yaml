frontier_explorer:
  ros__parameters:
    map_topic: /map
    costmap_topic: /global_costmap/costmap
    local_costmap_topic: /local_costmap/costmap
    navigate_to_pose_action_name: navigate_to_pose
    global_frame: map
    robot_base_frame: base_link
    map_processing_rate_hz: 1.0
    autostart: true
    mrtsp_solver: greedy
    escape_enabled: true
    frontier_selection_min_distance: 0.6
    frontier_candidate_min_goal_distance_m: 0.6
    occ_threshold: 65
    min_frontier_size_cells: 5
    goal_preemption_enabled: true
    goal_skip_on_blocked_goal: true
    frontier_suppression_enabled: false
